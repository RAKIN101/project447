{% extends 'base.html' %}{% block title %}Notifications | GovPay{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">ACTIVITY</p><h1>Notifications</h1></div></div><section class="panel">{% for item in notifications %}<a class="list-row clickable" href="/notifications/{{ item.id }}/open"><div><b>{{ item.title }}</b><small>{{ item.message }}</small></div><small>{{ item.created_at.strftime('%b %d, %H:%M') }}</small></a>{% else %}<p class="muted">No notifications.</p>{% endfor %}</section>{% endblock %}
