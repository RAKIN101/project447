{% extends 'base.html' %}{% block title %}Profile | GovPay{% endblock %}{% block content %}<div class="auth-card wide"><p class="eyebrow">YOUR ACCOUNT</p><h1>Profile</h1>{% if request.query_params.get('saved') %}<div class="notice success">Profile updated.</div>{% endif %}<form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Full name<input name="full_name" value="{{ profile_user.full_name }}" required></label><label>Username<input value="{{ profile_user.username }}" disabled></label><label>Email<input value="{{ profile_user.email }}" disabled></label><label>Role<input value="{{ profile_user.role.value }}" disabled></label><label>Phone<input name="phone" value="{{ profile_user.phone }}"></label><label class="full">Address<input name="address" value="{{ profile_user.address }}"></label><button class="button full">Save changes</button></form></div>{% endblock %}
