{% extends 'base.html' %}{% block title %}Create account | GovPay{% endblock %}{% block content %}<div class="auth-card wide"><p class="eyebrow">CITIZEN ACCOUNT</p><h1>Create your account</h1>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post" class="form-grid"><label>Full name<input name="full_name" required></label><label>Username<input name="username" required minlength="3"></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone"></label><label class="full">Address<input name="address"></label><label>Password<input type="password" name="password" required minlength="8"></label><label>Confirm password<input type="password" name="confirm_password" required></label><button class="button full">Create account</button></form></div>{% endblock %}
