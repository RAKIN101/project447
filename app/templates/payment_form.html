{% extends 'base.html' %}{% block title %}Pay bill | GovPay{% endblock %}{% block content %}<div class="auth-card wide"><p class="eyebrow">PAYMENT</p><h1>Pay {{ bill.title }}</h1><div class="payment-total">${{ '%.2f'|format(bill.amount) }}</div>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post"><label>Payment method<select name="payment_method" required><option>Mobile Banking</option><option>Card</option><option>Bank Transfer</option></select></label><button class="button">Confirm payment</button></form><p class="muted">This academic prototype does not connect to a real financial service.</p></div>{% endblock %}
